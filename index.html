<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Real Estate Ranch — CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161616; --ink2:#1f1f1f; --orange:#FF6A19; --orange-soft:#FFE9DC;
    --paper:#FAFAF8; --panel:#FFFFFF; --line:#E6E2DA; --muted:#7C7C77; --green:#2f7d4f;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  h1,h2,h3{font-family:'Zilla Slab',serif;margin:0}
  .hidden{display:none !important}
  #login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
  .card{background:var(--panel);border:2px solid #161616;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.28);width:100%;max-width:380px;padding:30px 28px}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:'Zilla Slab';font-weight:700;font-size:22px;margin-bottom:14px}
  .brand-name{font-size:20px;font-weight:700}
  .brand-tag{color:var(--orange);font-size:12.5px;margin-bottom:20px;font-weight:600}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 5px}
  input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{resize:vertical;min-height:58px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
  .btn{width:100%;font:inherit;font-weight:600;padding:12px;border-radius:10px;border:none;background:var(--orange);color:#fff;cursor:pointer;margin-top:18px;font-size:15px}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;color:var(--orange);margin-top:10px;font-size:13px}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:9px;line-height:1.45}
  .msg.err{background:#FDECEA;color:#B23B2E}
  .msg.ok{background:#E7F4EC;color:var(--green)}
  #app{display:flex;min-height:100vh}
  .sidebar{width:236px;background:var(--ink);color:#EDEBE4;flex:none;padding:18px 14px;display:flex;flex-direction:column;overflow:auto}
  .sb-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .sb-logo{width:34px;height:34px;border-radius:8px;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:'Zilla Slab';font-weight:700}
  .sb-brand b{font-size:14px}
  .sb-brand small{display:block;color:#9a978e;font-size:11px}
  .nav-group{margin-bottom:6px}
  .nav-group .glabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a877e;font-weight:700;padding:10px 12px 4px}
  .nav a{display:block;padding:8px 12px;border-radius:8px;color:#CFCCC4;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:1px;cursor:pointer;white-space:nowrap}
  .nav a.active,.nav a:hover{background:var(--orange);color:#fff}
  .sb-foot{margin-top:auto;font-size:12px;color:#9a978e;padding-top:12px}
  .sb-foot button{background:none;border:1px solid #3a3a3a;color:#CFCCC4;border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;width:100%;margin-top:8px}
  .main{flex:1;padding:24px 28px;overflow:auto}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .topbar h2{font-size:22px}
  .pill{margin-left:auto;background:var(--orange-soft);color:#9c3d12;font-weight:600;font-size:12px;padding:5px 12px;border-radius:20px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1.5px solid #161616;border-radius:var(--radius);padding:15px 18px;position:relative;overflow:hidden;box-shadow:0 2px 0 rgba(22,22,22,.06)}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .stat .v{font-family:'Zilla Slab';font-weight:700;font-size:28px;margin-top:6px}
  .panel{background:var(--panel);border:1.5px solid #161616;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 0 rgba(22,22,22,.06)}
  .panel h3{font-size:16px;margin-bottom:6px}
  .panel p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--orange-soft)}
  .empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
  .loado{color:var(--muted);font-size:13px}
  .tag{display:inline-block;background:var(--orange-soft);color:#9c3d12;font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;border:1.5px solid #161616}
  .badge.sub{background:#Eef;color:#334}
  .badge.rev{background:#FFF4E0;color:#8a5a12}
  .badge.app{background:#E7F4EC;color:var(--green)}
  .badge.att{background:#FDECEA;color:#B23B2E}
  .phasebar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
  .phase{flex:1;min-width:180px;background:var(--panel);border:1.5px solid #161616;border-left:4px solid var(--orange);border-radius:10px;padding:12px 14px}
  .phase b{font-size:13px}.phase span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .dir a{color:var(--orange);text-decoration:none;font-weight:600}
  .note{background:var(--orange-soft);border:1px solid #f2c7ad;color:#8a3a12;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px}
  .addbar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .btn-add{background:var(--orange);color:#fff;border:none;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
  .btn-add.sec{background:#fff;color:var(--ink);border:1.5px solid #161616}
  .btn-add:hover{filter:brightness(1.05)}
  .modal{position:fixed;inset:0;background:rgba(10,10,10,.5);display:grid;place-items:center;padding:20px;z-index:60}
  .modal-card{background:var(--panel);border:2px solid #161616;border-radius:14px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:22px 24px}
  .modal-card h3{font-size:18px;margin-bottom:4px}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions .btn{margin-top:0;flex:1}
  .modal-actions .btn.ghost{flex:0 0 auto;border:1px solid var(--line)}
  /* compliance checklist */
  .cl-phase{margin-bottom:10px}
  .cl-phase h4{font-family:'Zilla Slab';font-size:14px;margin:0 0 6px;padding:6px 10px;background:var(--ink);color:#fff;border-radius:8px}
  .cl-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
  .cl-item input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--orange)}
  .cl-item.done{opacity:.6;text-decoration:line-through}
  .prog{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 14px}
  .prog > i{display:block;height:100%;background:var(--orange)}
  .backbtn{background:none;border:none;color:var(--orange);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px;font-size:13.5px}
  .kv{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:13.5px}
  .kv b{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;display:block}
  .doc-row{display:flex;align-items:center;gap:12px;padding:10px;border:1.5px solid #161616;border-radius:10px;margin-bottom:8px;background:#fff}
  .doc-ic{font-size:20px;flex:none}
  .doc-meta{flex:1;min-width:0}
  .doc-meta b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-meta span{color:var(--muted);font-size:12px}
  .doc-btn{background:#fff;border:1.5px solid #161616;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
  .doc-btn:hover{filter:brightness(.97)}
  .doc-btn.del{color:#B23B2E;border-color:#B23B2E}
  .ev-day{margin-bottom:16px}
  .ev-day h4{font-family:'Zilla Slab';font-size:14px;margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
  .ev-item{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1.5px solid #161616;border-left:4px solid var(--orange);border-radius:10px;margin-bottom:8px;background:#fff}
  .ev-time{flex:0 0 118px;font-weight:700;font-size:13px;color:#9c3d12}
  .ev-main{flex:1;min-width:0;font-size:14px}
  .ev-note{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
  @media(max-width:760px){
    .ev-item{flex-direction:column;gap:3px;border-left-width:4px}
    .ev-time{flex:none}
  }
  @media(max-width:760px){
    #app{flex-direction:column}
    .sidebar{width:100%;flex-direction:column;position:static;padding:12px}
    .sb-brand{margin-bottom:10px}
    .nav{display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding-bottom:4px}
    .nav-group{margin:0;display:flex}
    .nav-group .glabel{display:none}
    .sb-foot{margin:10px 0 0;display:flex;align-items:center;gap:10px}
    .sb-foot button{width:auto;margin-top:0}
    .main{padding:16px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
    .topbar h2{font-size:20px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="logo">R</div>
    <div class="brand-name">The Real Estate Ranch</div>
    <div class="brand-tag">Texas Real Estate · Since 2007</div>
    <div id="authForms">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@reranch.com" autocomplete="username">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn" id="signinBtn">Sign in</button>
      <button class="btn ghost" id="toSignup">New here? Create an account</button>
      <button class="btn ghost hidden" id="toSignin">Have an account? Sign in</button>
      <button class="btn hidden" id="signupBtn">Create account</button>
      <div id="authMsg"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sb-brand"><div class="sb-logo">R</div><div><b>The Real Estate Ranch</b><small>CRM</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div id="whoami">—</div>
      <button id="signoutBtn">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><h2 id="viewTitle">Dashboard</h2><span class="pill" id="tierPill">—</span></div>
    <div id="viewBody"><div class="loado">Loading…</div></div>
  </main>
</div>

<!-- ADD MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">Add</h3>
    <div id="modalBody"></div>
    <div id="modalMsg"></div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
      <button class="btn" id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://rdhgowaockdfpyrzrrpj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_LUoABxqpg2OJu69QQftVXQ_gLJR_ecw';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const authMsg = (t, ok) => { $('authMsg').innerHTML = t ? `<div class="msg ${ok?'ok':'err'}">${t}</div>` : ''; };
  let profile = null, companyId = null, userId = null, curView = 'dashboard';

  const TIERS = {owner:'Owner', main_admin:'Main Admin', admin:'Admin', agent:'Agent'};
  const SING = {leads:'Lead', contacts:'Contact', buyers:'Buyer', sellers:'Seller', properties:'Listing', tasks:'Task', calendar_events:'Event'};
  const STATUSES = ['Submitted','Under Review','Approved','Needs Attention'];
  const badgeClass = s => ({'Submitted':'sub','Under Review':'rev','Approved':'app','Needs Attention':'att'}[s]||'sub');

  const FORMS = {
    leads: [ {n:'name',l:'Name',req:1},{n:'email',l:'Email'},{n:'phone',l:'Phone'},{n:'source',l:'Source'},
      {n:'status',l:'Status',opts:['New','Contacted','Qualified','Nurturing','Under Contract','Closed','Lost']},
      {n:'interest',l:'Interest'},{n:'deal_value',l:'Deal value ($)',type:'number'},{n:'area',l:'Area'},{n:'notes',l:'Notes',ta:1} ],
    contacts: [ {n:'name',l:'Name',req:1},{n:'type',l:'Type'},{n:'market',l:'Market'},{n:'email',l:'Email'},{n:'phone',l:'Phone'},{n:'notes',l:'Notes',ta:1} ],
    buyers: [ {n:'name',l:'Name',req:1},{n:'market',l:'Market'},{n:'email',l:'Email'},{n:'phone',l:'Phone'},
      {n:'budget_min',l:'Budget min ($)',type:'number'},{n:'budget_max',l:'Budget max ($)',type:'number'},
      {n:'timeline',l:'Timeline'},{n:'status',l:'Status'},{n:'notes',l:'Notes',ta:1} ],
    sellers: [ {n:'name',l:'Name',req:1},{n:'market',l:'Market'},{n:'email',l:'Email'},{n:'phone',l:'Phone'},
      {n:'property',l:'Property'},{n:'list_price',l:'List price ($)',type:'number'},{n:'timeline',l:'Timeline'},{n:'status',l:'Status'},{n:'notes',l:'Notes',ta:1} ],
    properties: [ {n:'name',l:'Listing name',req:1},{n:'type',l:'Type',opts:['Land','Residential','Commercial','Industrial','Ranch','Residential Lease','Industrial Lease']},
      {n:'board',l:'Board / Market',opts:['PBBOR (Permian Basin)','Odessa','Unlock MLS / ACTRIS (Austin)','Other']},
      {n:'status',l:'Status',opts:['Active','Pending','Under Contract','Sold','Withdrawn']},{n:'price',l:'Price ($)',type:'number'},{n:'mls_number',l:'MLS #'} ],
    tasks: [ {n:'title',l:'Task',req:1},{n:'status',l:'Status',opts:['To-do','In progress','Done']},
      {n:'priority',l:'Priority',opts:['Low','Medium','High']},{n:'due_date',l:'Due date',type:'date'} ],
    calendar_events: [ {n:'title',l:'Event',req:1},
      {n:'type',l:'Type',opts:['Open House','Training','Showing','Closing','Meeting','Deadline','Other']},
      {n:'event_date',l:'Date',req:1,type:'date'},{n:'start_time',l:'Start time',type:'time'},{n:'end_time',l:'End time',type:'time'},
      {n:'notes',l:'Notes / location',ta:1} ],
  };

  const GROUPS = [
    {label:'', items:[{v:'dashboard',t:'Dashboard',special:'dashboard'}]},
    {label:'CRM', items:[
      {v:'leads',t:'Leads',tbl:'leads',cols:['name','status','source','interest']},
      {v:'contacts',t:'Contacts',tbl:'contacts',cols:['name','email','phone','market']},
      {v:'buyers',t:'Buyers',tbl:'buyers',cols:['name','email','phone','market']},
      {v:'sellers',t:'Sellers',tbl:'sellers',cols:['name','email','phone','market']},
    ]},
    {label:'Deals', items:[
      {v:'listings',t:'Listings',special:'listings'},
      {v:'compliance',t:'Transactions',special:'compliance'},
    ]},
    {label:'Money', items:[
      {v:'commission',t:'Commission',special:'stub',desc:'Commission structures per agent, splits, and amount-due tracking pulled from each closed transaction.'},
      {v:'accounting',t:'Accounting',special:'stub',desc:'Brokerage ledger, invoicing, and payment tracking — the finance back office.'},
    ]},
    {label:'Work', items:[
      {v:'calendar',t:'Calendar',special:'calendar'},
      {v:'tasks',t:'Tasks',tbl:'tasks',cols:['title','status','priority','due_date']},
      {v:'marketing',t:'Marketing',special:'marketing'},
      {v:'reports',t:'Reports',special:'stub',desc:'Pipeline, production, and compliance reports across the brokerage.'},
    ]},
    {label:'Company', items:[
      {v:'directory',t:'Directory',special:'directory'},
      {v:'backoffice',t:'Back Office',tbl:'profiles',cols:['full_name','tier','email'],boAdmin:true},
    ]},
  ];
  const ALL = {}; GROUPS.forEach(g=>g.items.forEach(i=>ALL[i.v]=i));

  // ---- phase sorting for compliance forms ----
  function phaseOf(name){
    const n = String(name).toLowerCase();
    if (/iabs|information about broker|listing agreement|buyer.?s rep|buyer.?s representation|representation agreement|intermediary/.test(n)) return 1;
    if (/closing|walk-?through|title commitment|\bsurvey\b|settlement|disburs|commission|compensation/.test(n)) return 3;
    return 2;
  }
  const PHASE_NAMES = {1:'Phase 1 — Initial Docs', 2:'Phase 2 — Contract Documents & Addenda', 3:'Phase 3 — Closing Documents'};

  $('toSignup').onclick = () => { $('signinBtn').classList.add('hidden'); $('toSignup').classList.add('hidden'); $('signupBtn').classList.remove('hidden'); $('toSignin').classList.remove('hidden'); authMsg(''); };
  $('toSignin').onclick = () => { $('signinBtn').classList.remove('hidden'); $('toSignup').classList.remove('hidden'); $('signupBtn').classList.add('hidden'); $('toSignin').classList.add('hidden'); authMsg(''); };
  $('signinBtn').onclick = async () => {
    authMsg('Signing in…');
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) authMsg(error.message); else boot();
  };
  $('signupBtn').onclick = async () => {
    authMsg('Creating account…');
    const { error } = await sb.auth.signUp({ email: $('email').value.trim(), password: $('password').value });
    if (error) authMsg(error.message);
    else authMsg('Account created! Ask Chana or Lindsay to approve your access, then sign in.', true);
  };
  $('signoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  function buildNav(isAgent){
    const nav = $('nav'); nav.innerHTML = '';
    GROUPS.forEach(g => {
      const items = g.items.filter(i => !(i.boAdmin && isAgent));
      if(!items.length) return;
      const wrap = document.createElement('div'); wrap.className='nav-group';
      if(g.label) wrap.innerHTML = `<div class="glabel">${g.label}</div>`;
      items.forEach(i => {
        const a = document.createElement('a'); a.textContent=i.t; a.dataset.view=i.v;
        if(i.v==='dashboard') a.classList.add('active');
        a.onclick = () => { document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active')); a.classList.add('active'); renderView(i.v); };
        wrap.appendChild(a);
      });
      nav.appendChild(wrap);
    });
  }

  async function boot() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
    userId = user.id;
    const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    profile = prof || { email: user.email, tier: 'agent', full_name: user.email };
    const { data: comp } = await sb.from('companies').select('id').limit(1).maybeSingle();
    companyId = comp ? comp.id : null;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('whoami').textContent = (profile.full_name || profile.email || '');
    $('tierPill').textContent = TIERS[profile.tier] || 'Agent';
    buildNav(profile.tier === 'agent');
    renderView('dashboard');
  }

  async function count(table) {
    const { count, error } = await sb.from(table).select('*', { count:'exact', head:true });
    return error ? '—' : (count ?? 0);
  }

  async function renderView(v) {
    const m = ALL[v]; if(!m) return;
    curView = v;
    $('viewTitle').textContent = m.t;
    const body = $('viewBody'); body.innerHTML = '<div class="loado">Loading…</div>';
    try {
      if (m.special === 'dashboard') return renderDashboard(body);
      if (m.special === 'listings')  return renderListings(body);
      if (m.special === 'compliance')return renderCompliance(body);
      if (m.special === 'directory') return renderDirectory(body);
      if (m.special === 'calendar')  return renderCalendar(body);
      if (m.special === 'marketing') return renderMarketing(body);
      if (m.special === 'stub')      return renderStub(body, m);
      return renderTable(body, m);
    } catch (e) { body.innerHTML = `<div class="msg err">${e.message}</div>`; }
  }

  function addBar(table){
    return FORMS[table] ? `<div class="addbar"><button class="btn-add" type="button" onclick="openAddForm('${table}')">+ Add ${SING[table]||'record'}</button></div>` : '';
  }

  // ---- Add form (modal) ----
  function openAddForm(table){
    const fields = FORMS[table]; if(!fields) return;
    $('modalTitle').textContent = 'Add ' + (SING[table] || 'record');
    const importBlock = (table === 'properties') ? `
      <div class="note" style="margin-bottom:10px">Have an MLS sheet? <b>Import the PDF</b> to auto-fill these fields — then review and Save.</div>
      <input type="file" id="mlsFile" accept=".pdf" style="display:none">
      <button class="btn-add sec" type="button" id="mlsImportBtn" style="margin-bottom:12px">📄 Import from MLS sheet (PDF)</button>
      <div id="mlsMsg" style="margin-bottom:8px"></div>` : '';
    $('modalBody').innerHTML = importBlock + fields.map(f => {
      const id = 'f_' + f.n;

  // ---- MLS PDF import (auto-fill the listing form) ----
  function loadPdfJs(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
      s.onerror = () => rej(new Error('Could not load the PDF reader.'));
      document.head.appendChild(s);
    });
  }
  async function extractPdfText(file){
    const pdfjs = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const doc = await pdfjs.getDocument({ data: buf }).promise;
    let text = '';
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }
  function parseMls(text){
    const out = {};
    let m = text.match(/MLS\s*#?\s*:?\s*([A-Z]?\d[\dA-Z\-]{3,})/i); if(m) out.mls_number = m[1];
    m = text.match(/(?:List\s*Price|Current\s*Price|Price|LP)\s*:?\s*\$?\s*([\d][\d,]{2,})/i); if(m) out.price = m[1].replace(/,/g,'');
    m = text.match(/\b(\d{2,6}\s+[A-Za-z0-9.'\-\s]{3,44}?(?:Rd|Road|St|Street|Ave|Avenue|Dr|Drive|Ln|Lane|Blvd|Hwy|Highway|Ct|Court|Way|Trail|Pkwy|Cir|Circle|Acres?|Ranch|FM\s*\d+))\b/);
    if(m) out.name = m[1].replace(/\s+/g,' ').trim();
    const low = text.toLowerCase();
    if(/\bland\b|acreage|lot\b/.test(low)) out.type = 'Land';
    else if(/\bcommercial\b/.test(low)) out.type = 'Commercial';
    else if(/\bindustrial\b/.test(low)) out.type = 'Industrial';
    else if(/\branch\b|farm\b/.test(low)) out.type = 'Ranch';
    else if(/\bresidential\b|single family|\bsfr\b/.test(low)) out.type = 'Residential';
    if(/under\s*contract/.test(low)) out.status = 'Under Contract';
    else if(/\bpending\b/.test(low)) out.status = 'Pending';
    else if(/\bactive\b/.test(low)) out.status = 'Active';
    else if(/\bsold\b|closed\b/.test(low)) out.status = 'Sold';
    else if(/withdrawn|expired|cancel/.test(low)) out.status = 'Withdrawn';
    if(/pbbor|permian\s*basin/.test(low)) out.board = 'PBBOR (Permian Basin)';
    else if(/odessa/.test(low)) out.board = 'Odessa';
    else if(/actris|unlock\s*mls|austin/.test(low)) out.board = 'Unlock MLS / ACTRIS (Austin)';
    return out;
  }
  function setField(name, val){
    const el = $('f_' + name); if(!el || val == null || val === '') return false;
    if(el.tagName === 'SELECT'){
      const opt = Array.from(el.options).find(o => o.value === val || o.text === val);
      if(opt){ el.value = opt.value || opt.text; return true; }
      return false;
    }
    el.value = val; return true;
  }
  async function importMls(file){
    const msg = $('mlsMsg');
    msg.innerHTML = `<div class="loado">Reading ${esc(file.name)}…</div>`;
    try {
      const text = await extractPdfText(file);
      const parsed = parseMls(text);
      const filled = [];
      ['name','type','board','status','price','mls_number'].forEach(k => { if(setField(k, parsed[k])) filled.push(k.replace('_',' ')); });
      if(!filled.length){ msg.innerHTML = `<div class="msg err">Couldn't read fields from that PDF — fill the form in manually. (Works best with an MLS agent-detail sheet.)</div>`; return; }
      msg.innerHTML = `<div class="msg ok">Filled from the sheet: <b>${filled.join(', ')}</b>. Please review every field, then Save.</div>`;
    } catch(e){
      msg.innerHTML = `<div class="msg err">${e.message}</div>`;
    }
  }

  async function renderCalendar(body) {
    const { data, error } = await sb.from('calendar_events').select('*').order('event_date', { ascending:true }).limit(500);
    const bar = `<div class="addbar"><button class="btn-add" type="button" onclick="openAddForm('calendar_events')">+ Add Event</button></div>`;
    if (error) { body.innerHTML = bar + `<div class="msg err">${error.message}</div>`; return; }
    if (!data || !data.length) { body.innerHTML = bar + `<div class="panel"><div class="empty">No events yet. Click <b>+ Add Event</b> to add an open house, training, showing or closing — with start and end times.</div></div>`; return; }
    const todayStr = new Date().toISOString().slice(0,10);
    const fmtTime = t => { if(!t) return ''; const [h,mn] = String(t).split(':'); let hr = parseInt(h,10); const ap = hr>=12?'PM':'AM'; hr = hr%12||12; return `${hr}:${mn} ${ap}`; };
    const fmtRange = r => { const s = fmtTime(r.start_time), e = fmtTime(r.end_time); if(s&&e) return `${s} – ${e}`; if(s) return s; return 'All day'; };
    const dayKey = ev => String(ev.event_date||'').slice(0,10);
    const fmtDay = k => { const dt = new Date(k+'T00:00:00'); return dt.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'}); };
    const sortEv = (a,b) => (dayKey(a)+(a.start_time||'')).localeCompare(dayKey(b)+(b.start_time||''));
    const upcoming = data.filter(e => dayKey(e) >= todayStr).sort(sortEv);
    const past = data.filter(e => dayKey(e) < todayStr).sort(sortEv).reverse();
    const evCard = ev => `<div class="ev-item"><div class="ev-time">${fmtRange(ev)}</div><div class="ev-main"><b>${esc(ev.title||'Event')}</b> ${ev.type?`<span class="tag">${esc(ev.type)}</span>`:''}${ev.notes?`<span class="ev-note">${esc(ev.notes)}</span>`:''}</div></div>`;
    const groupByDay = evs => {
      const groups = {};
      evs.forEach(ev => { const k = dayKey(ev); (groups[k] = groups[k]||[]).push(ev); });
      return Object.keys(groups).map(k => `<div class="ev-day"><h4>${fmtDay(k)}</h4>${groups[k].map(evCard).join('')}</div>`).join('');
    };
    body.innerHTML = bar +
      `<div class="panel"><h3>Upcoming</h3>${upcoming.length ? groupByDay(upcoming) : '<div class="empty">Nothing coming up. Add an event above.</div>'}</div>` +
      (past.length ? `<div class="panel"><h3>Past events</h3>${groupByDay(past.slice(0,40))}</div>` : '');
  }

  async function renderMarketing(body) {
    const [emails, news, social] = await Promise.all([count('email_campaigns'), count('newsletters'), count('social_posts')]);
    body.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">Email Blasts</div><div class="v">${emails}</div></div>
        <div class="stat"><div class="k">Newsletters</div><div class="v">${news}</div></div>
        <div class="stat"><div class="k">Social Posts</div><div class="v">${social}</div></div>
      </div>
      <div class="panel"><h3>Email blast</h3>
        <p style="margin-bottom:12px">Pick an audience, write your message, and send. Use <b>{name}</b> in the message to drop in each recipient's name.</p>
        <label>Audience</label>
        <select id="blastAud">
          <option value="leads">Leads</option>
          <option value="contacts">Contacts</option>
          <option value="buyers">Buyers</option>
          <option value="sellers">Sellers</option>
        </select>
        <div id="blastCount" class="loado" style="margin:8px 0"></div>
        <label>Subject</label>
        <input id="blastSubj" type="text" placeholder="New Permian Basin listings this week">
        <label>Message</label>
        <textarea id="blastBody" style="min-height:140px" placeholder="Hi {name}, here's what's new at The Real Estate Ranch…"></textarea>
        <div class="modal-actions" style="margin-top:16px">
          <button class="btn-add sec" type="button" id="blastSave">Save campaign</button>
          <button class="btn-add" type="button" id="blastSend">Open in email app</button>
        </div>
        <div id="blastMsg" style="margin-top:12px"></div>
        <div class="note" style="margin-top:14px">For an automated send to a large list — with per-recipient <b>{name}</b> personalization and open tracking — we connect an email service like SendGrid or Mailchimp (a quick next step). <b>Open in email app</b> works now for a manual blast to the loaded list.</div>
      </div>`;
    const load = () => loadBlastAudience($('blastAud').value);
    $('blastAud').onchange = load;
    $('blastSave').onclick = saveBlast;
    $('blastSend').onclick = sendBlast;
    load();
  }
  async function loadBlastAudience(table){
    const el = $('blastCount'); el.textContent = 'Loading recipients…';
    const { data, error } = await sb.from(table).select('name,email').limit(2000);
    if(error){ el.innerHTML = `<div class="msg err">${error.message}</div>`; window.__blast = { recipients:[], audience:table }; return; }
    const recipients = (data||[]).filter(r => r.email && /.+@.+\..+/.test(r.email));
    window.__blast = { recipients, audience:table };
    el.innerHTML = `<b>${recipients.length}</b> recipient${recipients.length===1?'':'s'} with an email address in <b>${esc(table)}</b>.`;
  }
  async function saveBlast(){
    const msg = $('blastMsg');
    const subject = $('blastSubj').value.trim(), bodyText = $('blastBody').value.trim();
    const b = window.__blast || { recipients:[], audience:'leads' };
    if(!subject || !bodyText){ msg.innerHTML = `<div class="msg err">Add a subject and a message first.</div>`; return; }
    if(!companyId){ msg.innerHTML = `<div class="msg err">No brokerage linked to your account — ask an admin.</div>`; return; }
    msg.innerHTML = '<div class="loado">Saving…</div>';
    const { error } = await sb.from('email_campaigns').insert({ company_id: companyId, subject, body: bodyText, audience: b.audience, recipient_count: b.recipients.length, status: 'Draft' });
    if(error){ msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    msg.innerHTML = `<div class="msg ok">Campaign saved as a draft (${b.recipients.length} recipients). It's now counted under Email Blasts.</div>`;
  }
  function sendBlast(){
    const msg = $('blastMsg');
    const subject = $('blastSubj').value.trim(), bodyText = $('blastBody').value.trim();
    const b = window.__blast || { recipients:[] };
    if(!subject || !bodyText){ msg.innerHTML = `<div class="msg err">Add a subject and a message first.</div>`; return; }
    if(!b.recipients.length){ msg.innerHTML = `<div class="msg err">No recipients with email addresses in this audience.</div>`; return; }
    const bcc = b.recipients.map(r => r.email).join(',');
    const url = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
    window.open(url, '_blank');
    msg.innerHTML = `<div class="msg ok">Opening your email app with ${b.recipients.length} recipient${b.recipients.length===1?'':'s'} BCC'd — review and send from there. ({name} personalization applies once an email service is connected.)</div>`;
  }

  function renderStub(body, m) {
    body.innerHTML = `<div class="panel"><h3>${m.t}</h3><p>${m.desc||''}</p><p style="margin-top:10px"><span class="tag">Set up — configuration next</span> This module is part of the app and ready to be built out next.</p></div>`;
  }

  boot();
</script>
</body>
</html>
