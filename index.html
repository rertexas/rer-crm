<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Real Estate Ranch — CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161616; --ink2:#1f1f1f; --orange:#FF6A19; --orange-soft:#FFE9DC;
    --paper:#FAFAF8; --panel:#FFFFFF; --line:#E6E2DA; --muted:#7C7C77; --green:#2f7d4f;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  h1,h2,h3{font-family:'Zilla Slab',serif;margin:0}
  .hidden{display:none !important}
  /* Login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.18);width:100%;max-width:380px;padding:30px 28px}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:'Zilla Slab';font-weight:700;font-size:22px;margin-bottom:14px}
  .brand-name{font-size:20px;font-weight:700}
  .brand-tag{color:var(--orange);font-size:12.5px;margin-bottom:20px;font-weight:600}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 5px}
  input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}
  input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
  .btn{width:100%;font:inherit;font-weight:600;padding:12px;border-radius:10px;border:none;background:var(--orange);color:#fff;cursor:pointer;margin-top:18px;font-size:15px}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;color:var(--orange);margin-top:10px;font-size:13px}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:9px;line-height:1.45}
  .msg.err{background:#FDECEA;color:#B23B2E}
  .msg.ok{background:#E7F4EC;color:var(--green)}
  /* App shell */
  #app{display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--ink);color:#EDEBE4;flex:none;padding:18px 14px;display:flex;flex-direction:column}
  .sb-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .sb-logo{width:34px;height:34px;border-radius:8px;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:'Zilla Slab';font-weight:700}
  .sb-brand b{font-size:14px}
  .sb-brand small{display:block;color:#9a978e;font-size:11px}
  .nav a{display:block;padding:10px 12px;border-radius:9px;color:#CFCCC4;text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;cursor:pointer}
  .nav a.active,.nav a:hover{background:var(--orange);color:#fff}
  .sb-foot{margin-top:auto;font-size:12px;color:#9a978e}
  .sb-foot button{background:none;border:1px solid #3a3a3a;color:#CFCCC4;border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;width:100%;margin-top:8px}
  .main{flex:1;padding:26px 30px;overflow:auto}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .topbar h2{font-size:22px}
  .pill{margin-left:auto;background:var(--orange-soft);color:#9c3d12;font-weight:600;font-size:12px;padding:5px 12px;border-radius:20px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .stat .v{font-family:'Zilla Slab';font-weight:700;font-size:30px;margin-top:6px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
  .panel h3{font-size:16px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
  .loado{color:var(--muted);font-size:13px}
  @media(max-width:700px){.sidebar{display:none}.main{padding:18px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="logo">R</div>
    <div class="brand-name">The Real Estate Ranch</div>
    <div class="brand-tag">Texas Real Estate · Since 2007</div>
    <div id="authForms">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@reranch.com" autocomplete="username">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn" id="signinBtn">Sign in</button>
      <button class="btn ghost" id="toSignup">New here? Create an account</button>
      <button class="btn ghost hidden" id="toSignin">Have an account? Sign in</button>
      <button class="btn hidden" id="signupBtn">Create account</button>
      <div id="authMsg"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sb-brand"><div class="sb-logo">R</div><div><b>The Real Estate Ranch</b><small>CRM</small></div></div>
    <nav class="nav">
      <a class="active" data-view="dashboard">Dashboard</a>
      <a data-view="leads">Leads</a>
      <a data-view="listings">Listings</a>
      <a data-view="compliance">Compliance</a>
    </nav>
    <div class="sb-foot">
      <div id="whoami">—</div>
      <button id="signoutBtn">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><h2 id="viewTitle">Dashboard</h2><span class="pill" id="tierPill">—</span></div>
    <div id="viewBody"><div class="loado">Loading…</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://rdhgowaockdfpyrzrrpj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_LUoABxqpg2OJu69QQftVXQ_gLJR_ecw';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const authMsg = (t, ok) => { $('authMsg').innerHTML = t ? `<div class="msg ${ok?'ok':'err'}">${t}</div>` : ''; };
  let profile = null;

  // toggle signup/signin
  $('toSignup').onclick = () => { $('signinBtn').classList.add('hidden'); $('toSignup').classList.add('hidden'); $('signupBtn').classList.remove('hidden'); $('toSignin').classList.remove('hidden'); authMsg(''); };
  $('toSignin').onclick = () => { $('signinBtn').classList.remove('hidden'); $('toSignup').classList.remove('hidden'); $('signupBtn').classList.add('hidden'); $('toSignin').classList.add('hidden'); authMsg(''); };

  $('signinBtn').onclick = async () => {
    authMsg('Signing in…');
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) authMsg(error.message); else boot();
  };
  $('signupBtn').onclick = async () => {
    authMsg('Creating account…');
    const { error } = await sb.auth.signUp({ email: $('email').value.trim(), password: $('password').value });
    if (error) authMsg(error.message);
    else authMsg('Account created! If email confirmation is on, check your inbox, then sign in.', true);
  };
  $('signoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  async function boot() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
    // load profile
    const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    profile = prof || { email: user.email, tier: 'agent', full_name: user.email };
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('whoami').textContent = (profile.full_name || profile.email || '');
    const tierLabel = ({owner:'Owner', main_admin:'Main Admin', admin:'Admin', agent:'Agent'})[profile.tier] || 'Agent';
    $('tierPill').textContent = tierLabel;
    renderView('dashboard');
  }

  document.querySelectorAll('.nav a').forEach(a => a.onclick = () => {
    document.querySelectorAll('.nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    renderView(a.dataset.view);
  });

  async function renderView(v) {
    const titles = { dashboard:'Dashboard', leads:'Leads', listings:'Listings', compliance:'Compliance' };
    $('viewTitle').textContent = titles[v] || v;
    const body = $('viewBody');
    body.innerHTML = '<div class="loado">Loading…</div>';
    try {
      if (v === 'dashboard') return renderDashboard(body);
      if (v === 'leads') return renderTable(body, 'leads', ['name','status','source','interest']);
      if (v === 'listings') return renderTable(body, 'properties', ['name','type','board','status']);
      if (v === 'compliance') return renderTable(body, 'compliance_files', ['deal','type','status']);
    } catch (e) { body.innerHTML = `<div class="msg err">${e.message}</div>`; }
  }

  async function count(table) {
    const { count, error } = await sb.from(table).select('*', { count:'exact', head:true });
    return error ? '—' : (count ?? 0);
  }

  async function renderDashboard(body) {
    const [leads, props, compl, types] = await Promise.all([count('leads'), count('properties'), count('compliance_files'), count('transaction_types')]);
    body.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">My Leads</div><div class="v">${leads}</div></div>
        <div class="stat"><div class="k">Listings</div><div class="v">${props}</div></div>
        <div class="stat"><div class="k">Compliance Files</div><div class="v">${compl}</div></div>
        <div class="stat"><div class="k">Transaction Types</div><div class="v">${types}</div></div>
      </div>
      <div class="panel">
        <h3>Welcome, ${profile.full_name || profile.email || 'there'} 👋</h3>
        <p style="color:var(--muted);font-size:14px;line-height:1.6;margin:0">
          You're signed in to the live Real Estate Ranch CRM. The numbers above come straight from your database and respect your access level —
          as <b>${({owner:'Owner',main_admin:'Main Admin',admin:'Admin',agent:'Agent'})[profile.tier]||'Agent'}</b> you see
          ${profile.tier==='agent' ? 'your own leads, listings and compliance' : 'the whole brokerage'}.
        </p>
      </div>`;
  }

  async function renderTable(body, table, cols) {
    const { data, error } = await sb.from(table).select('*').order('created_at', { ascending:false }).limit(100);
    if (error) { body.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    if (!data || !data.length) { body.innerHTML = `<div class="panel"><div class="empty">Nothing here yet. Records you add (and that your access level lets you see) will appear here.</div></div>`; return; }
    const head = cols.map(c => `<th>${c.replace('_',' ')}</th>`).join('');
    const rows = data.map(r => `<tr>${cols.map(c => `<td>${r[c] ?? '—'}</td>`).join('')}</tr>`).join('');
    body.innerHTML = `<div class="panel"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // start
  boot();
</script>
</body>
</html>
